<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Byaku: apartment map (v1)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 340px 1fr; height: 100vh; transition: grid-template-columns 0.2s; }
    body.collapsed { grid-template-columns: 0 1fr; }
    body.collapsed #panel { display: none; }
    #toggle {
      position: absolute; top: 50%; transform: translateY(-50%); left: 352px; z-index: 1000;
      width: 36px; height: 36px; border-radius: 18px; border: 1px solid #bbb; background: #fff;
      font-size: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: left 0.2s;
    }
    body.collapsed #toggle { left: 12px; }
    #panel { padding: 16px; overflow-y: auto; border-right: 1px solid #ddd; grid-column: 1; }
    #map { height: 100vh; grid-column: 2; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 14px; padding: 8px 12px; width: 100%; cursor: pointer; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 12px; font-size: 14px; }
    .muted { color: #666; font-size: 13px; }
    .error { color: #b00020; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="panel">
    <h2 style="margin-top:0">Apartment map</h2>
    <p class="muted">Type the address yourself. We never open listing pages.</p>
    <form id="listing-form">
      <label>Address <input id="address" required placeholder="e.g. 350 W 42nd St, New York, NY" /></label>
      <label>Unit type
        <select id="unit_type"><option value="studio">Studio</option><option value="1br">1 bedroom</option></select>
      </label>
      <label>Monthly base rent ($) <input id="base_rent" type="number" min="0" max="5500" required /></label>
      <label>Listing link (optional, saved as text only) <input id="source_url" type="text" placeholder="paste a link to remember it" /></label>
      <button type="submit">Add apartment to map</button>
    </form>
    <h3>Map layers</h3>
    <label><input type="checkbox" id="layer-subway" /> Subway lines and stations</label>
    <label><input type="checkbox" id="layer-crime" /> Crime blocks (street blocks, last 12 months)</label>
    <label><input type="checkbox" id="layer-hospitals" /> Hospitals</label>
    <h3>My Google Maps lists</h3>
    <p class="muted" style="margin:0 0 6px">Export from Google Takeout (Maps), then upload the list files here. Each file becomes one list.</p>
    <input type="file" id="list-files" accept=".json,.csv,application/json,text/csv" multiple />
    <div id="list-toggles"></div>
    <button id="list-clear" type="button">Remove imported lists</button>
    <div id="status" class="muted"></div>
    <div id="details"></div>
  </div>
  <div id="map"></div>
  <button id="toggle" type="button" aria-label="Hide panel">◀</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Collapse/expand the side panel. Starts collapsed on phone-width screens.
    (function () {
      const body = document.body;
      const btn = document.getElementById("toggle");
      function setCollapsed(on) {
        body.classList.toggle("collapsed", on);
        btn.textContent = on ? "▶" : "◀";
        btn.setAttribute("aria-label", on ? "Show panel" : "Hide panel");
        // Let the map resize to the new width once the layout has changed.
        setTimeout(() => window.dispatchEvent(new Event("resize")), 250);
      }
      btn.addEventListener("click", () => setCollapsed(!body.classList.contains("collapsed")));
      if (window.innerWidth < 600) setCollapsed(true);
    })();
  </script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
