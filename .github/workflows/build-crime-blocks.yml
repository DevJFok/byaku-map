name: build-crime-blocks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"   # 1st of each month, 09:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - run: python scripts/build_blocks.py
      - name: Commit the updated blocks file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blocks-manhattan.geojson data/hospitals-manhattan.geojson
          git diff --cached --quiet && echo "No changes." || git commit -m "Update crime blocks"
          git push
